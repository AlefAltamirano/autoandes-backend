server:
  port: ${PORT:8080}

spring:
  application:
    name: autoandes-backend
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1522/FREEPDB1}
    username: ${DB_USERNAME:AUTOANDES_DB}
    password: ${DB_PASSWORD:123456}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  packages-to-scan: pe.edu.upeu.autoandes.controller
  paths-to-match: /api/v1/**, /auth/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true